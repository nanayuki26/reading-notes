<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>読書備忘録</title>
<style>
:root {
  color-scheme: light dark;
  --background: #f7f4ee;
  --surface: #fffdf9;
  --text: #2b2926;
  --muted: #6d675f;
  --border: #ddd6ca;
  --primary: #33594f;
  --star: #a8701a;
  --spoiler: #f1e9dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #1d1c1a;
    --surface: #282623;
    --text: #ece8e1;
    --muted: #a9a297;
    --border: #45413b;
    --primary: #7fb5a5;
    --star: #e2b25e;
    --spoiler: #35312c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  line-height: 1.7;
}
.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 32px 16px 48px;
}
header { margin-bottom: 20px; }
h1 {
  margin: 0;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.8rem;
}
.updated {
  margin: 2px 0 14px;
  color: var(--muted);
  font-size: 0.85rem;
}
button {
  min-height: 42px;
  padding: 8px 14px;
  border: 1px solid var(--primary);
  border-radius: 8px;
  background: transparent;
  color: var(--primary);
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.book {
  margin-bottom: 14px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.book-title {
  margin: 0;
  font-size: 1.15rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.book-author {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  overflow-wrap: anywhere;
}
.stars {
  margin: 6px 0 0;
  color: var(--star);
  letter-spacing: 2px;
}
.review {
  margin: 10px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.spoiler-toggle { margin-top: 12px; }
.spoiler {
  margin-top: 10px;
  padding: 2px 14px 12px;
  border-radius: 8px;
  background: var(--spoiler);
}
.empty {
  padding: 32px 0;
  color: var(--muted);
  text-align: center;
}
</style>
</head>
<body>
<div class="page">
<header>
<h1>読書備忘録</h1>
<p class="updated">2冊 ・ 最終更新 2026-11-02</p>
<button type="button" id="toggle-all" class="toggle-all">すべてのネタバレを表示</button>
</header>
<main>
<article class="book">
<h2 class="book-title">テスト本</h2>
<p class="book-author">ああああ</p>
<p class="review">ネタバレなし</p>
<button type="button" class="spoiler-toggle" aria-expanded="false" aria-controls="spoiler-0">ネタバレを見る</button>
<div id="spoiler-0" class="spoiler" hidden><p class="review">ねたばれあり</p></div>
</article>
<article class="book">
<h2 class="book-title">テスト2　直接公開できるか</h2>
<p class="book-author">ああ</p>
</article>
</main>
</div>
<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.spoiler-toggle'));
  var toggleAll = document.getElementById('toggle-all');
  if (!toggleAll) return;

  function isOpen(button) {
    return button.getAttribute('aria-expanded') === 'true';
  }
  function setOpen(button, open) {
    document.getElementById(button.getAttribute('aria-controls')).hidden = !open;
    button.setAttribute('aria-expanded', String(open));
    button.textContent = open ? 'ネタバレを隠す' : 'ネタバレを見る';
  }
  function updateToggleAll() {
    toggleAll.textContent = buttons.every(isOpen) ? 'すべてのネタバレを隠す' : 'すべてのネタバレを表示';
  }

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      setOpen(button, !isOpen(button));
      updateToggleAll();
    });
  });
  toggleAll.addEventListener('click', function () {
    var open = !buttons.every(isOpen);
    buttons.forEach(function (button) { setOpen(button, open); });
    updateToggleAll();
  });
})();
</script>
</body>
</html>
