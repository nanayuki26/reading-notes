<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>読書備忘録</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234fb0de'/%3E%3Cpath d='M6 9.5c3.5-1 7-.6 10 1.3v13.4c-3-1.9-6.5-2.3-10-1.3z' fill='%23ffffff'/%3E%3Cpath d='M26 9.5c-3.5-1-7-.6-10 1.3v13.4c3-1.9 6.5-2.3 10-1.3z' fill='%23dcf0fa'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --background: #f7f4ee;
  --surface: #fffdf9;
  --text: #2b2926;
  --muted: #6d675f;
  --border: #ddd6ca;
  --primary: #33594f;
  --star: #a8701a;
  --spoiler: #f1e9dc;
  --mark-bg: #f6e2a0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #1d1c1a;
    --surface: #282623;
    --text: #ece8e1;
    --muted: #a9a297;
    --border: #45413b;
    --primary: #7fb5a5;
    --star: #e2b25e;
    --spoiler: #35312c;
    --mark-bg: #5c4a17;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  line-height: 1.7;
}
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 16px 48px;
}
header { margin-bottom: 20px; }
h1 {
  margin: 0;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.8rem;
}
.updated {
  margin: 2px 0 14px;
  color: var(--muted);
  font-size: 0.85rem;
}
button {
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}
button:hover { border-color: var(--text); }
button:focus-visible,
select:focus-visible,
.search:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
button[aria-pressed="true"],
.page-number[aria-current="page"] {
  border-color: var(--text);
  background: var(--text);
  color: var(--background);
}
.chip {
  min-height: 30px;
  padding: 1px 10px;
  border-radius: 999px;
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chips:empty { display: none; }
.note {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}
.search {
  width: 100%;
  min-height: 40px;
  margin-bottom: 12px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
select {
  min-height: 36px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.field {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 0.85rem;
}
/* 絞り込み。行ごとに見出しを付け、タグの一覧は必要なときだけ開く */
.filter-panel {
  display: grid;
  gap: 10px;
  margin-bottom: 20px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}
.filter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.filter-label { flex: 0 0 4.5em; }
.filter-row > .filter-label {
  color: var(--muted);
  font-size: 0.85rem;
}
.tag-picker {
  padding: 10px 0 0 calc(4.5em + 16px);
  border-top: 1px dashed var(--border);
}
.tag-search {
  max-width: 280px;
  min-height: 34px;
  margin-bottom: 10px;
}
.reset-row {
  display: flex;
  justify-content: flex-end;
  margin-top: -4px;
}
.list-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  scroll-margin-top: 16px;
}
.list-toolbar[hidden] { display: none; }
.layout-toggle { display: flex; }
.layout-button {
  min-height: 32px;
  padding: 4px 12px;
  font-size: 0.82rem;
}
.layout-button:first-child { border-radius: 8px 0 0 8px; }
.layout-button:last-child {
  margin-left: -1px;
  border-radius: 0 8px 8px 0;
}
/* 本のカード */
.book-list {
  display: grid;
  gap: 12px;
}
.book {
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.book[hidden] { display: none; }
.book-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 12px;
}
.book-heading {
  flex: 1 1 100%;
  min-width: 0;
}
.book-title {
  margin: 0;
  font-size: 1.1rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.book-author {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.88rem;
  overflow-wrap: anywhere;
}
.stars {
  margin: 4px 0 0;
  color: var(--star);
  letter-spacing: 2px;
}
.book-main {
  display: flex;
  gap: 14px;
}
.book-body {
  flex: 1 1 auto;
  min-width: 0;
}
.book-cover {
  flex: 0 0 64px;
  width: 64px;
  height: auto;
  align-self: flex-start;
  border-radius: 3px;
}
.book-chips { margin-top: 10px; }
.review {
  margin: 10px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
/* 一覧では感想を最初の3行だけ見せる。全文は本のページで読む */
.review-preview {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}
.book-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 10px;
}
.spoiler-badge {
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.78rem;
}
.open-button { min-width: 64px; }
/* 本のページ */
.book-page[hidden] { display: none; }
.back-button { margin-bottom: 16px; }
.book-page-body {
  padding: 22px 22px 26px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.book-page-head {
  display: flex;
  gap: 18px;
}
.book-page-cover {
  flex: 0 0 120px;
  width: 120px;
  height: auto;
  align-self: flex-start;
  border-radius: 4px;
}
.book-page-body .book-title { font-size: 1.35rem; }
.book-page-body .review {
  margin-top: 18px;
  font-size: 1rem;
  line-height: 1.9;
}
.spoiler-toggle { margin-top: 20px; }
.spoiler {
  margin-top: 12px;
  padding: 2px 16px 14px;
  border-radius: 8px;
  background: var(--spoiler);
}
.spoiler[hidden] { display: none; }
.spoiler-tags {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}
/* コンパクト表示。1冊を1行にし、「開く」で本のページへ移る */
.book-list.compact {
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.compact .book {
  padding: 8px 12px;
  border: 0;
  border-radius: 0;
  background: none;
}
.compact .book + .book { border-top: 1px solid var(--border); }
.compact .book:not([hidden]) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
}
.compact .book-main { flex: 1 1 260px; }
.compact .book-cover,
.compact .book-chips,
.compact .review-preview { display: none; }
.compact .book-foot { margin: 0; }
.compact .book-head { align-items: center; }
.compact .book-heading {
  display: flex;
  flex: 1 1 200px;
  align-items: baseline;
  gap: 4px 10px;
}
.compact .book-title,
.compact .book-author {
  overflow: hidden;
  margin: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.compact .book-title { font-size: 0.95rem; }
.compact .stars { margin: 0; }
.search-mark {
  border-radius: 2px;
  background: var(--mark-bg);
  color: inherit;
}
/* ページ切り替え。先頭・最後のページの前へ・次へは隠さず暗くする */
.pagination {
  display: grid;
  justify-items: center;
  gap: 12px;
  margin: 20px 0 8px;
}
.pagination[hidden] { display: none; }
.pagination-pages {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.page-number { min-width: 40px; }
.page-step:disabled {
  border-color: var(--border);
  opacity: 0.45;
  cursor: default;
}
.page-gap {
  min-width: 20px;
  color: var(--muted);
  text-align: center;
}
.to-top {
  position: fixed;
  right: 16px;
  bottom: 16px;
  box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
}
.empty {
  padding: 32px 0;
  color: var(--muted);
  text-align: center;
}
@media (max-width: 559px) {
  .tag-picker { padding-left: 0; }
  .book-page-head { flex-direction: column; }
  .book-page-cover { flex-basis: auto; }
}
</style>
</head>
<body>
<div class="page">
<header>
<h1>読書備忘録</h1>
<p class="updated">3冊 ・ 最終更新 2026-11-03</p>
</header>
<div id="list-view">
<input type="search" id="search" class="search" placeholder="タイトル・著者・ジャンル・タグ・感想を検索（/ で移動）" aria-label="本を検索">
<div class="filter-panel">
<div class="filter-row"><label class="field"><span class="filter-label">ジャンル</span><select id="genre-select"><option value="" data-label="すべて">すべて</option><option value="SF" data-label="SF">SF</option><option value="サスペンス" data-label="サスペンス">サスペンス</option></select></label><label class="field"><span>重さ</span><select id="weight-select"><option value="" data-label="すべて">すべて</option><option value="light" data-label="軽め">軽め</option><option value="medium" data-label="ふつう">ふつう</option></select></label><label class="field"><span>並び替え</span><select id="sort-select"><option value="order">新しく読んだ順</option><option value="rating">評価の高い順</option><option value="title">タイトル順</option></select></label></div>

<span class="filter-label">タグ</span>

</div>

<input type="search" id="tag-search" class="search tag-search" placeholder="タグを探す" aria-label="タグを探す" autocomplete="off">
<div id="tag-list" class="chips" role="group" aria-label="タグで絞り込み"><button type="button" class="chip filter-chip" data-tag="キャラクター〇" aria-pressed="false">#キャラクター〇 <span class="count"></span></button><button type="button" class="chip filter-chip" data-tag="テストタグA" aria-pressed="false">#テストタグA <span class="count"></span></button><button type="button" class="chip filter-chip" data-tag="テンポ〇" aria-pressed="false">#テンポ〇 <span class="count"></span></button></div>
<p id="tag-empty" class="note" hidden>該当するタグはありません。</p>
</div>
<div class="reset-row"><button type="button" id="reset-button" class="chip" title="検索・絞り込みを外し、新しく読んだ順に戻す">条件をリセット</button></div>
</div>
<div id="list-toolbar" class="list-toolbar">
<p id="list-range" class="note"></p>
<div class="layout-toggle" role="group" aria-label="一覧の表示">
<button type="button" class="layout-button" data-layout="card" aria-pressed="true">カード</button>
<button type="button" class="layout-button" data-layout="compact" aria-pressed="false">コンパクト</button>
</div>
</div>
<main id="book-list" class="book-list">
<article class="book" data-id="xjvbcy0pq9" data-order="0" data-rating="3" data-genre="SF" data-weight="medium">
<div class="book-main"><img class="book-cover" src="https://img.hanmoto.com/bd/img/9784488011116_600.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><div class="book-body"><div class="book-head"><div class="book-heading"><h2 class="book-title">ピラネージ</h2><p class="book-author">Susanna Clarke</p></div><p class="stars" aria-label="評価 3 / 5">★★★☆☆</p></div><div class="chips book-chips"><button type="button" class="chip filter-chip" data-genre="SF" aria-pressed="false">SF</button><button type="button" class="chip filter-chip" data-weight="medium" aria-pressed="false">ふつう</button><button type="button" class="chip filter-chip" data-tag="テストタグA" aria-pressed="false">#テストタグA</button></div></div></div>
<div class="book-foot"><button type="button" class="chip open-button" aria-label="「ピラネージ」の感想を開く">開く</button></div>

<article class="book" data-id="1jiztkq20mh" data-order="1" data-rating="4" data-genre="サスペンス" data-weight="medium">
<div class="book-main"><img class="book-cover" src="https://img.hanmoto.com/bd/img/9784065363041_600.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><div class="book-body"><div class="book-head"><div class="book-heading"><h2 class="book-title">法廷占拠 : 爆弾 2</h2><p class="book-author">呉勝浩</p></div><p class="stars" aria-label="評価 4 / 5">★★★★☆</p></div><div class="chips book-chips"><button type="button" class="chip filter-chip" data-genre="サスペンス" aria-pressed="false">サスペンス</button><button type="button" class="chip filter-chip" data-weight="medium" aria-pressed="false">ふつう</button></div><p class="review review-preview">；</p></div></div>

</article>
<article class="book" data-id="13tzac6fwb2" data-order="2" data-rating="5" data-genre="SF" data-weight="light">
<div class="book-main"><img class="book-cover" src="https://img.hanmoto.com/bd/img/9784150125066_600.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><div class="book-body"><div class="book-head"><div class="book-heading"><h2 class="book-title">プロジェクト・ヘイル・メアリー</h2><p class="book-author">Andy Weir</p></div><p class="stars" aria-label="評価 5 / 5">★★★★★</p></div><div class="chips book-chips"><button type="button" class="chip filter-chip" data-genre="SF" aria-pressed="false">SF</button><button type="button" class="chip filter-chip" data-weight="light" aria-pressed="false">軽め</button><button type="button" class="chip filter-chip" data-tag="キャラクター〇" aria-pressed="false">#キャラクター〇</button><button type="button" class="chip filter-chip" data-tag="テンポ〇" aria-pressed="false">#テンポ〇</button></div><p class="review review-preview">最高</p></div></div>
<div class="book-foot"><span class="spoiler-badge">ネタバレあり</span><button type="button" class="chip open-button" aria-label="「プロジェクト・ヘイル・メアリー」の感想を開く">開く</button></div>
<template class="spoiler-template"><p class="review">ロッキー</p></template>
</article>
</main>
<p id="no-results" class="empty" role="status" hidden>条件に合う本はありません。</p>
<nav id="pagination" class="pagination" aria-label="本の一覧のページ">
<div class="pagination-pages">
<button type="button" id="page-prev" class="page-step">‹ 前へ</button>
<span id="page-numbers" class="pagination-pages"></span>
<button type="button" id="page-next" class="page-step">次へ ›</button>
</div>
<label class="field"><span>1ページの表示数</span><select id="page-size"><option value="20">20件</option><option value="50">50件</option><option value="100">100件</option></select></label>
</nav>
</div>
<main id="book-page" class="book-page" hidden>
<button type="button" id="back-button" class="chip back-button">← 一覧に戻る</button>
<article id="book-page-body" class="book-page-body"></article>
</main>
</div>
<button type="button" id="to-top" class="to-top" hidden>↑ 上へ戻る</button>
<script>
// 表紙を読み込めなかったら消し、表紙なしとして表示する
(function () {
  Array.prototype.slice.call(document.querySelectorAll('.book-cover')).forEach(function (image) {
    if (image.complete && image.naturalWidth === 0) image.remove();
    else image.addEventListener('error', function () { image.remove(); });
  });
})();

// 下へスクロールしたら「上へ戻る」を出す
(function () {
  var toTop = document.getElementById('to-top');
  window.addEventListener('scroll', function () {
    toTop.hidden = window.scrollY < window.innerHeight;
  }, { passive: true });
  toTop.addEventListener('click', function () {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
})();

(function () {
  var searchInput = document.getElementById('search');
  if (!searchInput) return;

  var list = document.getElementById('book-list');
  var noResults = document.getElementById('no-results');
  var genreSelect = document.getElementById('genre-select');
  var weightSelect = document.getElementById('weight-select');
  var sortSelect = document.getElementById('sort-select');
  var selectedTags = document.getElementById('selected-tags');
  var tagPickerButton = document.getElementById('tag-picker-button');
  var tagPicker = document.getElementById('tag-picker');
  var tagSearch = document.getElementById('tag-search');
  var tagEmpty = document.getElementById('tag-empty');
  var tagButtons = Array.prototype.slice.call(document.querySelectorAll('#tag-list [data-tag]'));
  var listToolbar = document.getElementById('list-toolbar');
  var listRange = document.getElementById('list-range');
  var layoutButtons = Array.prototype.slice.call(document.querySelectorAll('.layout-button'));
  var pagination = document.getElementById('pagination');
  var pageNumbers = document.getElementById('page-numbers');
  var pagePrev = document.getElementById('page-prev');
  var pageNext = document.getElementById('page-next');
  var pageSizeSelect = document.getElementById('page-size');
  var listView = document.getElementById('list-view');
  var bookPage = document.getElementById('book-page');
  var bookPageBody = document.getElementById('book-page-body');
  var backButton = document.getElementById('back-button');
  var baseTitle = document.title;

  // 表示数と表示の形だけを、見る人のブラウザに残す（本のデータは残さない）
  function loadSetting(key, fallback) {
    try {
      return localStorage.getItem('reading-notes:' + key) || fallback;
    } catch (error) {
      return fallback;
    }
  }
  function saveSetting(key, value) {
    try {
      localStorage.setItem('reading-notes:' + key, value);
    } catch (error) {
      // 残せなくても、開いている間は使える
    }
  }

  var savedSize = Number(loadSetting('page-size', '20'));
  var state = {
    search: '', genre: '', weight: '', tags: [], sort: 'order', page: 1,
    pageSize: [20, 50, 100].indexOf(savedSize) !== -1 ? savedSize : 20,
    layout: loadSetting('layout', 'card') === 'compact' ? 'compact' : 'card',
    pickerOpen: false, tagQuery: '',
  };
  var lastKey = '';

  function toComparable(text) {
    return text.normalize('NFKC').toLowerCase();
  }
  // カタカナとひらがなを同じに扱う
  function toTagKey(text) {
    return toComparable(text).replace(/[\u30a1-\u30f6]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }

  // 検索の対象はタイトル・著者・ジャンル・重さ・タグ・ネタバレなしの感想。ネタバレは入れない
  var books = Array.prototype.slice.call(list.querySelectorAll('.book')).map(function (article) {
    var title = article.querySelector('.book-title');
    var author = article.querySelector('.book-author');
    var review = article.querySelector('.review-preview');
    var chips = Array.prototype.slice.call(article.querySelectorAll('.book-chips .chip'));
    return {
      article: article,
      id: article.getAttribute('data-id'),
      order: Number(article.getAttribute('data-order')),
      rating: Number(article.getAttribute('data-rating')),
      genre: article.getAttribute('data-genre'),
      weight: article.getAttribute('data-weight'),
      tags: chips.filter(function (chip) { return chip.hasAttribute('data-tag'); })
        .map(function (chip) { return chip.getAttribute('data-tag'); }),
      marked: [title, author, review].filter(Boolean).map(function (element) {
        return { element: element, text: element.textContent };
      }),
      titleText: title.textContent,
      reviewText: review ? review.textContent : '',
      spoiler: article.querySelector('.spoiler-template'),
      text: toComparable([title, author, review].concat(chips).filter(Boolean)
        .map(function (element) { return element.textContent; }).join('\n')),
    };
  });

  function searchWords() {
    return toComparable(state.search).split(/\s+/).filter(Boolean);
  }

  // skip に渡した条件は外して判定する（選択肢の冊数を数えるため）
  function matches(book, skip) {
    if (skip !== 'genre' && state.genre && book.genre !== state.genre) return false;
    if (skip !== 'weight' && state.weight && book.weight !== state.weight) return false;
    if (!state.tags.every(function (tag) { return book.tags.indexOf(tag) !== -1; })) return false;
    var words = searchWords();
    return words.every(function (word) { return book.text.indexOf(word) !== -1; });
  }

  var SORTS = {
    order: function (a, b) { return a.order - b.order; },
    rating: function (a, b) { return b.rating - a.rating || a.order - b.order; },
    title: function (a, b) { return a.titleText.localeCompare(b.titleText, 'ja') || a.order - b.order; },
  };

  // 検索語を <mark> で囲む。全角半角の違いまでは合わせず、書いたとおりの文字を探す
  function applyMarks(item) {
    var element = item.element;
    var text = item.text;
    var words = state.search.trim().split(/\s+/).filter(Boolean).map(function (word) { return word.toLowerCase(); });
    var lower = text.toLowerCase();
    element.textContent = '';
    if (words.length === 0 || lower.length !== text.length) {
      element.textContent = text;
      return;
    }
    var marked = new Array(text.length).fill(false);
    words.forEach(function (word) {
      for (var start = lower.indexOf(word); start !== -1; start = lower.indexOf(word, start + word.length)) {
        marked.fill(true, start, start + word.length);
      }
    });
    var start = 0;
    for (var index = 1; index <= text.length; index += 1) {
      if (index === text.length || marked[index] !== marked[start]) {
        var part = text.slice(start, index);
        if (marked[start]) {
          var mark = document.createElement('mark');
          mark.className = 'search-mark';
          mark.textContent = part;
          element.appendChild(mark);
        } else {
          element.appendChild(document.createTextNode(part));
        }
        start = index;
      }
    }
  }

  // 表示するページ番号の並び。多いときは「1 … 4 5 6 … 12」のように途中を省く（null が「…」）
  function pageItems(page, total) {
    var result = [];
    if (total <= 7) {
      for (var number = 1; number <= total; number += 1) result.push(number);
      return result;
    }
    var pages = [1, page - 1, page, page + 1, total].filter(function (value, index, all) {
      return value >= 1 && value <= total && all.indexOf(value) === index;
    }).sort(function (a, b) { return a - b; });
    pages.forEach(function (value, index) {
      if (index > 0 && value - pages[index - 1] > 1) result.push(null);
      result.push(value);
    });
    return result;
  }

  function updateOptions(select, kind) {
    if (!select) return;
    Array.prototype.slice.call(select.options).forEach(function (option) {
      var count = books.filter(function (book) {
        return matches(book, kind) && (!option.value || book[kind] === option.value);
      }).length;
      option.textContent = option.getAttribute('data-label') + '（' + count + '）';
    });
    select.value = state[kind];
  }

  function renderTags(visibleBooks) {
    if (!selectedTags) return;
    selectedTags.textContent = '';
    state.tags.forEach(function (tag) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'chip';
      button.setAttribute('aria-pressed', 'true');
      button.setAttribute('aria-label', 'タグ「' + tag + '」の絞り込みを外す');
      button.textContent = '#' + tag + ' ×';
      button.addEventListener('click', function () { toggleTag(tag); });
      selectedTags.appendChild(button);
    });
    tagPickerButton.textContent = state.pickerOpen ? 'タグの一覧を閉じる' : 'タグを選ぶ（' + tagButtons.length + '）';
    tagPickerButton.setAttribute('aria-expanded', String(state.pickerOpen));
    tagPicker.hidden = !state.pickerOpen;
    var query = toTagKey(state.tagQuery.trim());
    var shown = 0;
    tagButtons.forEach(function (button) {
      var tag = button.getAttribute('data-tag');
      button.hidden = query !== '' && toTagKey(tag).indexOf(query) === -1;
      if (!button.hidden) shown += 1;
      button.querySelector('.count').textContent = visibleBooks.filter(function (book) {
        return book.tags.indexOf(tag) !== -1;
      }).length;
    });
    tagEmpty.hidden = shown > 0;
  }

  function renderPagination(total, pageCount) {
    pagination.hidden = total === 0;
    listToolbar.hidden = total === 0;
    var first = (state.page - 1) * state.pageSize + 1;
    listRange.textContent = total + '冊中 ' + first + '〜' + Math.min(state.page * state.pageSize, total) + '冊目';
    pagePrev.disabled = state.page <= 1;
    pageNext.disabled = state.page >= pageCount;
    pageNumbers.textContent = '';
    pageItems(state.page, pageCount).forEach(function (page) {
      var item;
      if (page === null) {
        item = document.createElement('span');
        item.className = 'page-gap';
        item.textContent = '…';
      } else {
        item = document.createElement('button');
        item.type = 'button';
        item.className = 'page-number';
        item.textContent = String(page);
        item.setAttribute('aria-label', page + 'ページ目');
        if (page === state.page) item.setAttribute('aria-current', 'page');
        item.addEventListener('click', function () { goToPage(page); });
      }
      pageNumbers.appendChild(item);
    });
    pageSizeSelect.value = String(state.pageSize);
  }

  function update() {
    // 条件が変わったら1ページ目に戻す
    var key = JSON.stringify([state.search, state.genre, state.weight, state.tags, state.sort, state.pageSize]);
    if (key !== lastKey) state.page = 1;
    lastKey = key;

    var visibleBooks = books.filter(function (book) { return matches(book, null); }).sort(SORTS[state.sort]);
    var pageCount = Math.max(1, Math.ceil(visibleBooks.length / state.pageSize));
    state.page = Math.min(state.page, pageCount);
    var pageStart = (state.page - 1) * state.pageSize;
    var shownBooks = visibleBooks.slice(pageStart, pageStart + state.pageSize);

    list.classList.toggle('compact', state.layout === 'compact');
    books.forEach(function (book) { book.article.hidden = shownBooks.indexOf(book) === -1; });
    shownBooks.forEach(function (book) {
      list.appendChild(book.article); // 並び替えた順に並べ直す
      book.marked.forEach(applyMarks);
    });
    noResults.hidden = visibleBooks.length > 0;

    updateOptions(genreSelect, 'genre');
    updateOptions(weightSelect, 'weight');
    sortSelect.value = state.sort;
    renderTags(visibleBooks);
    renderPagination(visibleBooks.length, pageCount);
    layoutButtons.forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-layout') === state.layout));
    });
    Array.prototype.slice.call(document.querySelectorAll('.filter-chip')).forEach(function (chip) {
      var pressed;
      if (chip.hasAttribute('data-genre')) pressed = chip.getAttribute('data-genre') === state.genre;
      else if (chip.hasAttribute('data-weight')) pressed = chip.getAttribute('data-weight') === state.weight;
      else pressed = state.tags.indexOf(chip.getAttribute('data-tag')) !== -1;
      chip.setAttribute('aria-pressed', String(pressed));
    });
  }

  function goToPage(page) {
    state.page = page;
    update();
    listToolbar.scrollIntoView({ block: 'start' });
  }

  function toggleTag(tag) {
    state.tags = state.tags.indexOf(tag) !== -1
      ? state.tags.filter(function (item) { return item !== tag; })
      : state.tags.concat([tag]);
    update();
  }

  // カードのジャンル・重さ・タグと、タグの一覧のボタン。もう一度押すと解除する
  document.addEventListener('click', function (event) {
    var chip = event.target.closest('.filter-chip');
    if (!chip) return;
    if (chip.hasAttribute('data-genre')) {
      var genre = chip.getAttribute('data-genre');
      state.genre = state.genre === genre ? '' : genre;
    } else if (chip.hasAttribute('data-weight')) {
      var weight = chip.getAttribute('data-weight');
      state.weight = state.weight === weight ? '' : weight;
    } else {
      state.tags = state.tags.indexOf(chip.getAttribute('data-tag')) !== -1
        ? state.tags.filter(function (item) { return item !== chip.getAttribute('data-tag'); })
        : state.tags.concat([chip.getAttribute('data-tag')]);
    }
    update();
    if (!bookPage.hidden) showList(); // 本のページで押したら、その条件の一覧へ戻る
  });

  // ---- 本のページ（#book-番号）----
  // 一覧から開いたときは、戻ると前の絞り込み・ページ・スクロール位置のまま一覧に戻る
  var openedFromList = false;
  var listScrollY = 0;

  function createElement(tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  function findBook(id) {
    return books.filter(function (book) { return book.id === id; })[0] || null;
  }

  // ネタバレは押したときに確かめてから開く。隠すときは確かめない
  function createSpoiler(book) {
    var button = createElement('button', 'spoiler-toggle', 'ネタバレを見る');
    button.type = 'button';
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('aria-controls', 'book-page-spoiler');
    var spoiler = createElement('div', 'spoiler');
    spoiler.id = 'book-page-spoiler';
    spoiler.hidden = true;
    spoiler.appendChild(book.spoiler.content.cloneNode(true));
    button.addEventListener('click', function () {
      var open = spoiler.hidden;
      if (open && !window.confirm('本当に「' + book.titleText + '」のネタバレを開いていいですか？')) return;
      spoiler.hidden = !open;
      button.setAttribute('aria-expanded', String(open));
      button.textContent = open ? 'ネタバレを隠す' : 'ネタバレを見る';
    });
    return [button, spoiler];
  }

  function renderBookPage(book) {
    bookPageBody.textContent = '';
    var head = createElement('div', 'book-page-head');
    var cover = book.article.querySelector('.book-cover');
    if (cover) {
      var image = createElement('img', 'book-page-cover');
      image.src = cover.src;
      image.alt = '';
      image.referrerPolicy = 'no-referrer';
      image.addEventListener('error', function () { image.remove(); });
      head.appendChild(image);
    }
    var info = createElement('div', 'book-body');
    info.appendChild(createElement('h2', 'book-title', book.titleText));
    var author = book.article.querySelector('.book-author');
    if (author) info.appendChild(createElement('p', 'book-author', author.textContent));
    var stars = book.article.querySelector('.stars');
    if (stars) info.appendChild(stars.cloneNode(true));
    var chips = book.article.querySelector('.book-chips');
    if (chips) info.appendChild(chips.cloneNode(true));
    head.appendChild(info);
    bookPageBody.appendChild(head);
    if (book.reviewText) bookPageBody.appendChild(createElement('p', 'review', book.reviewText));
    if (book.spoiler) createSpoiler(book).forEach(function (element) { bookPageBody.appendChild(element); });
  }

  // URLの #book-番号 に合わせて、本のページか一覧を出す。知らない番号なら一覧を出す
  function route() {
    var match = /^#book-([0-9a-z]+)$/.exec(window.location.hash);
    var book = match ? findBook(match[1]) : null;
    if (book) {
      if (!listView.hidden) listScrollY = window.scrollY;
      renderBookPage(book);
      listView.hidden = true;
      bookPage.hidden = false;
      document.title = book.titleText + ' - ' + baseTitle;
      window.scrollTo(0, 0);
      return;
    }
    var wasBookPage = !bookPage.hidden;
    bookPage.hidden = true;
    listView.hidden = false;
    document.title = baseTitle;
    if (wasBookPage) window.scrollTo(0, listScrollY);
  }

  // 一覧から開いていれば履歴を戻る。リンクで本のページを直接開いたときは、一覧を新しく開く
  function showList() {
    if (openedFromList) {
      openedFromList = false;
      window.history.back();
      return;
    }
    window.history.pushState(null, '', window.location.pathname + window.location.search);
    route();
  }

  list.addEventListener('click', function (event) {
    var button = event.target.closest('.open-button');
    if (!button) return;
    openedFromList = true;
    window.location.hash = 'book-' + button.closest('.book').getAttribute('data-id');
  });
  backButton.addEventListener('click', showList);
  window.addEventListener('hashchange', route);

  searchInput.addEventListener('input', function () {
    state.search = searchInput.value;
    update();
  });
  if (genreSelect) {
    genreSelect.addEventListener('change', function () {
      state.genre = genreSelect.value;
      update();
    });
  }
  if (weightSelect) {
    weightSelect.addEventListener('change', function () {
      state.weight = weightSelect.value;
      update();
    });
  }
  sortSelect.addEventListener('change', function () {
    state.sort = sortSelect.value;
    update();
  });
  if (tagPickerButton) {
    tagPickerButton.addEventListener('click', function () {
      state.pickerOpen = !state.pickerOpen;
      update();
      if (state.pickerOpen) tagSearch.focus();
    });
    tagSearch.addEventListener('input', function () {
      state.tagQuery = tagSearch.value;
      update();
    });
  }
  // 表示数と表示の形は好みの設定なので、リセットでは戻さない
  document.getElementById('reset-button').addEventListener('click', function () {
    state.search = '';
    state.genre = '';
    state.weight = '';
    state.tags = [];
    state.sort = 'order';
    state.pickerOpen = false;
    state.tagQuery = '';
    searchInput.value = '';
    if (tagSearch) tagSearch.value = '';
    update();
  });
  layoutButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      state.layout = button.getAttribute('data-layout');
      saveSetting('layout', state.layout);
      update();
    });
  });
  pagePrev.addEventListener('click', function () { goToPage(state.page - 1); });
  pageNext.addEventListener('click', function () { goToPage(state.page + 1); });
  pageSizeSelect.addEventListener('change', function () {
    state.pageSize = Number(pageSizeSelect.value);
    saveSetting('page-size', String(state.pageSize));
    update();
  });
  // 「/」で検索欄へ移る。文字の入力中と本のページでは、ふつうの「/」として扱う
  document.addEventListener('keydown', function (event) {
    if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
    if (!bookPage.hidden || event.target.closest('input, textarea, select, [contenteditable]')) return;
    event.preventDefault();
    searchInput.focus();
    searchInput.select();
  });

  update();
  route();
})();
</script>
</body>
</html>
