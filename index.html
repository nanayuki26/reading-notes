<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>読書備忘録</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234fb0de'/%3E%3Cpath d='M6 9.5c3.5-1 7-.6 10 1.3v13.4c-3-1.9-6.5-2.3-10-1.3z' fill='%23ffffff'/%3E%3Cpath d='M26 9.5c-3.5-1-7-.6-10 1.3v13.4c3-1.9 6.5-2.3 10-1.3z' fill='%23dcf0fa'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --background: #f7f4ee;
  --surface: #fffdf9;
  --text: #2b2926;
  --muted: #6d675f;
  --border: #ddd6ca;
  --primary: #33594f;
  --star: #a8701a;
  --spoiler: #f1e9dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #1d1c1a;
    --surface: #282623;
    --text: #ece8e1;
    --muted: #a9a297;
    --border: #45413b;
    --primary: #7fb5a5;
    --star: #e2b25e;
    --spoiler: #35312c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  line-height: 1.7;
}
.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 32px 16px 48px;
}
header { margin-bottom: 20px; }
h1 {
  margin: 0;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.8rem;
}
.updated {
  margin: 2px 0 14px;
  color: var(--muted);
  font-size: 0.85rem;
}
button {
  min-height: 42px;
  padding: 8px 14px;
  border: 1px solid var(--primary);
  border-radius: 8px;
  background: transparent;
  color: var(--primary);
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
}
button:focus-visible,
.search:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.controls { margin-bottom: 20px; }
.search {
  width: 100%;
  min-height: 42px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.filter-button {
  min-height: 32px;
  padding: 2px 10px;
  border-color: var(--border);
  border-radius: 999px;
  color: var(--text);
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}
.filter-button[aria-pressed="true"] {
  border-color: var(--primary);
  background: var(--primary);
  color: var(--background);
}
.book {
  margin-bottom: 14px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.book-title {
  margin: 0;
  font-size: 1.15rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.book-author {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  overflow-wrap: anywhere;
}
.stars {
  margin: 6px 0 0;
  color: var(--star);
  letter-spacing: 2px;
}
.review {
  margin: 10px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.spoiler-toggle { margin-top: 12px; }
.spoiler {
  margin-top: 10px;
  padding: 2px 14px 12px;
  border-radius: 8px;
  background: var(--spoiler);
}
.spoiler-tags {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}
.empty {
  padding: 32px 0;
  color: var(--muted);
  text-align: center;
}
</style>
</head>
<body>
<div class="page">
<header>
<h1>読書備忘録</h1>
<p class="updated">3冊 ・ 最終更新 2026-11-03</p>

</header>
<div class="controls">
<input type="search" id="search" class="search" placeholder="タイトル・著者・ジャンル・タグ・感想を検索" aria-label="本を検索">
<div class="filters" role="group" aria-label="ジャンルで絞り込み"><button type="button" class="filter-button" data-genre="SF" aria-pressed="false">SF</button><button type="button" class="filter-button" data-genre="サスペンス" aria-pressed="false">サスペンス</button></div>
<div class="filters" role="group" aria-label="読む重さで絞り込み"><button type="button" class="filter-button" data-weight="light" aria-pressed="false">軽め</button><button type="button" class="filter-button" data-weight="medium" aria-pressed="false">ふつう</button></div>
<div class="filters" role="group" aria-label="タグで絞り込み"><button type="button" class="filter-button" data-tag="キャラクター〇" aria-pressed="false">#キャラクター〇</button><button type="button" class="filter-button" data-tag="テストタグA" aria-pressed="false">#テストタグA</button><button type="button" class="filter-button" data-tag="テンポ〇" aria-pressed="false">#テンポ〇</button></div>
</div>
<main>
<article class="book">
<h2 class="book-title">ピラネージ</h2>
<p class="book-author">Susanna Clarke</p>
<p class="stars" aria-label="評価 3 / 5">★★★☆☆</p>
<div class="filters book-tags"><button type="button" class="filter-button" data-genre="SF" aria-pressed="false">SF</button><button type="button" class="filter-button" data-weight="medium" aria-pressed="false">ふつう</button><button type="button" class="filter-button" data-tag="テストタグA" aria-pressed="false">#テストタグA</button></div>
</article>
<article class="book">
<h2 class="book-title">法廷占拠 : 爆弾 2</h2>
<p class="book-author">呉勝浩</p>
<p class="stars" aria-label="評価 4 / 5">★★★★☆</p>
<div class="filters book-tags"><button type="button" class="filter-button" data-genre="サスペンス" aria-pressed="false">サスペンス</button><button type="button" class="filter-button" data-weight="medium" aria-pressed="false">ふつう</button></div>
</article>
<article class="book">
<h2 class="book-title">プロジェクト・ヘイル・メアリー</h2>
<p class="book-author">Andy Weir</p>
<p class="stars" aria-label="評価 5 / 5">★★★★★</p>
<div class="filters book-tags"><button type="button" class="filter-button" data-genre="SF" aria-pressed="false">SF</button><button type="button" class="filter-button" data-weight="light" aria-pressed="false">軽め</button><button type="button" class="filter-button" data-tag="キャラクター〇" aria-pressed="false">#キャラクター〇</button><button type="button" class="filter-button" data-tag="テンポ〇" aria-pressed="false">#テンポ〇</button></div>
</article>
<p id="no-results" class="empty" role="status" hidden>条件に合う本はありません。</p>
</main>
</div>
<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.spoiler-toggle'));
  var toggleAll = document.getElementById('toggle-all');
  if (!toggleAll) return;

  function isOpen(button) {
    return button.getAttribute('aria-expanded') === 'true';
  }
  function setOpen(button, open) {
    document.getElementById(button.getAttribute('aria-controls')).hidden = !open;
    button.setAttribute('aria-expanded', String(open));
    button.textContent = open ? 'ネタバレを隠す' : 'ネタバレを見る';
  }
  function updateToggleAll() {
    toggleAll.textContent = buttons.every(isOpen) ? 'すべてのネタバレを隠す' : 'すべてのネタバレを表示';
  }

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      setOpen(button, !isOpen(button));
      updateToggleAll();
    });
  });
  toggleAll.addEventListener('click', function () {
    var open = !buttons.every(isOpen);
    buttons.forEach(function (button) { setOpen(button, open); });
    updateToggleAll();
  });
})();

(function () {
  var searchInput = document.getElementById('search');
  if (!searchInput) return;

  var noResults = document.getElementById('no-results');
  var filterButtons = Array.prototype.slice.call(document.querySelectorAll('.filter-button'));
  var currentGenre = '';
  var currentWeight = '';
  var currentTag = '';

  function toComparable(text) {
    return text.normalize('NFKC').toLowerCase();
  }

  // ネタバレは検索の対象にしない
  function readSearchText(article) {
    return toComparable(Array.prototype.slice.call(article.children)
      .filter(function (element) { return !element.matches('.spoiler, .spoiler-toggle, .stars'); })
      .map(function (element) { return element.textContent; })
      .join('\n'));
  }

  var books = Array.prototype.slice.call(document.querySelectorAll('.book')).map(function (article) {
    var genreButton = article.querySelector('[data-genre]');
    var weightButton = article.querySelector('[data-weight]');
    return {
      article: article,
      text: readSearchText(article),
      genre: genreButton ? genreButton.getAttribute('data-genre') : '',
      weight: weightButton ? weightButton.getAttribute('data-weight') : '',
      tags: Array.prototype.slice.call(article.querySelectorAll('[data-tag]')).map(function (button) {
        return button.getAttribute('data-tag');
      }),
    };
  });

  function update() {
    var words = toComparable(searchInput.value).split(/\s+/).filter(Boolean);
    var visibleCount = 0;

    books.forEach(function (book) {
      var visible = (!currentGenre || book.genre === currentGenre)
        && (!currentWeight || book.weight === currentWeight)
        && (!currentTag || book.tags.indexOf(currentTag) !== -1)
        && words.every(function (word) { return book.text.indexOf(word) !== -1; });
      book.article.hidden = !visible;
      if (visible) visibleCount += 1;
    });
    noResults.hidden = visibleCount > 0;

    filterButtons.forEach(function (button) {
      var pressed;
      if (button.hasAttribute('data-genre')) {
        pressed = button.getAttribute('data-genre') === currentGenre;
      } else if (button.hasAttribute('data-tag')) {
        pressed = button.getAttribute('data-tag') === currentTag;
      } else {
        pressed = button.getAttribute('data-weight') === currentWeight;
      }
      button.setAttribute('aria-pressed', String(pressed));
    });
  }

  filterButtons.forEach(function (button) {
    button.addEventListener('click', function () { // もう一度押すと解除する
      if (button.hasAttribute('data-genre')) {
        var genre = button.getAttribute('data-genre');
        currentGenre = currentGenre === genre ? '' : genre;
      } else if (button.hasAttribute('data-tag')) {
        var tag = button.getAttribute('data-tag');
        currentTag = currentTag === tag ? '' : tag;
      } else {
        var weight = button.getAttribute('data-weight');
        currentWeight = currentWeight === weight ? '' : weight;
      }
      update();
    });
  });
  searchInput.addEventListener('input', update);
})();
</script>
</body>
</html>
